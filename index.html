<title>剧情志 - 游戏剧情体验记录</title>
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f5f6f8;
  --surface: #ffffff;
  --surface-hover: #f0f1f4;
  --border: #e4e6eb;
  --text: #1a1a2e;
  --text-secondary: #6b7280;
  --text-tertiary: #9ca3af;
  --accent: #4f6df5;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.08), 0 4px 12px rgba(0,0,0,0.04);
  --radius: 14px;
  --radius-sm: 8px;
  --transition: 0.2s ease;
}
html { font-size: 15px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

/* ===== Layout ===== */
#app { max-width: 1100px; margin: 0 auto; padding: 0 24px 80px; }

/* 保存状态提示条 */
.persist-banner {
  max-width: 1100px; margin: 14px auto 0; padding: 10px 16px;
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 0.82rem; line-height: 1.5;
  border: 1px solid #f0d9a8; border-radius: var(--radius-sm);
  background: #fffaf0; color: #8a5a00;
}
.persist-banner b { color: #6b4300; }
.persist-banner .pb-btn {
  margin-left: auto; padding: 4px 12px; border-radius: 6px;
  border: 1px solid #e0b96a; background: #fff; color: #8a5a00;
  text-decoration: none; font-size: 0.8rem; white-space: nowrap;
}
.persist-banner .pb-btn:hover { background: #fff2d6; }
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 28px 0 24px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 32px;
}
.header h1 {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
}
.header h1 .logo-mark {
  width: 32px; height: 32px;
  background: var(--text);
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 1.1rem;
}
.header-actions { display: flex; gap: 10px; }
.btn {
  border: none; cursor: pointer;
  font-family: inherit; font-size: 0.85rem;
  padding: 8px 16px; border-radius: var(--radius-sm);
  transition: var(--transition);
  display: inline-flex; align-items: center; gap: 6px;
  font-weight: 500;
}
.btn-ghost { background: transparent; color: var(--text-secondary); border: 1px solid var(--border); }
.btn-ghost:hover { background: var(--surface-hover); color: var(--text); }
.btn-primary { background: var(--text); color: #fff; }
.btn-primary:hover { opacity: 0.85; }

/* ===== View Transition ===== */
.view { animation: fadeIn 0.3s ease; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Breadcrumb ===== */
.breadcrumb {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 24px; font-size: 0.85rem; color: var(--text-secondary);
}
.breadcrumb a { cursor: pointer; color: var(--text-secondary); text-decoration: none; transition: var(--transition); }
.breadcrumb a:hover { color: var(--text); }
.breadcrumb .sep { color: var(--text-tertiary); }

/* ===== Game Library ===== */
.library-intro { margin-bottom: 28px; }
.library-intro h2 { font-size: 1.15rem; font-weight: 600; margin-bottom: 4px; }
.library-intro p { color: var(--text-secondary); font-size: 0.9rem; }
.game-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 20px;
}
.game-card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.game-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.game-logo-area {
  height: 140px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.game-logo-area::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
}
.game-logo-text {
  font-size: 2.2rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: 0.05em;
  text-shadow: 0 2px 12px rgba(0,0,0,0.2);

}
.game-logo-en {
  font-size: 0.75rem;
  color: rgba(255,255,255,0.7);
  margin-top: 6px;
  z-index: 1;
  letter-spacing: 0.1em;

}
.game-logo-en { position: absolute; bottom: 16px; }
.game-card-body { padding: 18px 20px; }
.game-card-body h3 { font-size: 1.1rem; font-weight: 600; margin-bottom: 6px; }
.game-card-meta { display: flex; gap: 12px; font-size: 0.8rem; color: var(--text-tertiary); margin-bottom: 12px; }
.game-card-meta span { display: flex; align-items: center; gap: 4px; }
.progress-bar {
  height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 4px;
}
.progress-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.progress-text { font-size: 0.75rem; color: var(--text-tertiary); margin-top: 6px; }

/* ===== Game Detail Header ===== */
.game-detail-header {
  display: flex; gap: 24px; align-items: center;
  margin-bottom: 36px; padding: 28px;
  background: var(--surface); border-radius: var(--radius); border: 1px solid var(--border);
}
.game-detail-logo {
  width: 80px; height: 80px; border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.8rem; font-weight: 800; color: #fff;
  flex-shrink: 0;
}
.game-detail-info h2 { font-size: 1.6rem; font-weight: 700; margin-bottom: 4px; }
.game-detail-info .subtitle { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 10px; }
.game-detail-stats { display: flex; gap: 20px; }
.stat-item { text-align: center; }
.stat-item .num { font-size: 1.3rem; font-weight: 700; }
.stat-item .label { font-size: 0.75rem; color: var(--text-tertiary); }

/* ===== Section Title ===== */
.section-title {
  font-size: 1.1rem; font-weight: 600; margin-bottom: 20px;
  display: flex; align-items: center; justify-content: space-between;
}
.section-title .filter-chips { display: flex; gap: 8px; }
.filter-chip {
  font-size: 0.78rem; padding: 4px 12px; border-radius: 20px;
  cursor: pointer; transition: var(--transition);
  border: 1px solid var(--border); background: var(--surface); color: var(--text-secondary);
}
.filter-chip.active { background: var(--text); color: #fff; border-color: var(--text); }
.filter-chip:hover:not(.active) { background: var(--surface-hover); }

/* ===== Version Cards ===== */
.version-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
  gap: 20px;
}
.version-card {
  background: var(--surface);
  border-radius: var(--radius);
  overflow: hidden;
  cursor: pointer;
  transition: var(--transition);
  border: 1px solid var(--border);
}
.version-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.version-poster {
  width: 100%; aspect-ratio: 16/9;
  object-fit: cover;
  display: block;
  background: var(--surface-hover);
}
.version-poster-placeholder {
  width: 100%; aspect-ratio: 16/9;
  display: flex; align-items: center; justify-content: center;
  font-size: 2.5rem; color: rgba(255,255,255,0.5);
}
.version-card-body { padding: 16px 18px; }
.version-tag {
  display: inline-block; font-size: 0.72rem; font-weight: 600;
  padding: 2px 8px; border-radius: 4px; margin-bottom: 8px;
}
.version-card-body h4 { font-size: 1rem; font-weight: 600; margin-bottom: 4px; }
.version-card-body .episode-count { font-size: 0.8rem; color: var(--text-tertiary); }
.version-card-body .progress-row {
  display: flex; align-items: center; gap: 8px; margin-top: 10px;
}

/* ===== Episode List ===== */
.episode-list { display: flex; flex-direction: column; gap: 12px; }
.episode-item {
  display: flex; align-items: center; gap: 16px;
  padding: 16px 20px; background: var(--surface);
  border-radius: var(--radius-sm); border: 1px solid var(--border);
  transition: var(--transition); cursor: pointer;
}
.episode-item:hover { border-color: var(--text-tertiary); box-shadow: var(--shadow); }
.episode-poster {
  width: 200px; height: 112px; border-radius: 8px;
  object-fit: cover; flex-shrink: 0; background: var(--surface-hover);
}
.episode-poster-placeholder {
  width: 200px; height: 112px; border-radius: 8px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 1.6rem; color: rgba(255,255,255,0.6);
}
.episode-info { flex: 1; min-width: 0; }
.episode-info h4 { font-size: 0.95rem; font-weight: 600; margin-bottom: 4px; }
.episode-info .meta { font-size: 0.8rem; color: var(--text-tertiary); }
.episode-status {
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.status-badge {
  font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; font-weight: 500;
  white-space: nowrap;
}
.status-badge.completed { background: #dcfce7; color: #16a34a; }
.status-badge.playing { background: #fef3c7; color: #d97706; }
.status-badge.planned { background: #e0e7ff; color: #4f46e5; }
.status-badge.dropped { background: #fee2e2; color: #dc2626; }
.status-badge.unset { background: #f3f4f6; color: #9ca3af; }
.star-display { font-size: 0.85rem; color: #f59e0b; letter-spacing: 1px; white-space: nowrap; }

/* ===== Review Modal ===== */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  display: flex; align-items: center; justify-content: center;
  z-index: 100; animation: fadeIn 0.2s ease; padding: 20px;
}
.modal {
  background: var(--surface); border-radius: var(--radius);
  width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto;
  box-shadow: var(--shadow-lg);
  animation: slideUp 0.3s ease;
}
@keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header { padding: 24px 24px 0; }
.modal-header h3 { font-size: 1.2rem; font-weight: 600; }
.modal-header .modal-subtitle { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
.modal-body { padding: 20px 24px; }
.modal-footer { padding: 0 24px 24px; display: flex; justify-content: flex-end; gap: 10px; }
.form-group { margin-bottom: 18px; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 500; margin-bottom: 8px; color: var(--text); }
.star-input { display: flex; gap: 4px; font-size: 1.6rem; cursor: pointer; }
.star-input .star { color: #d1d5db; transition: var(--transition); user-select: none; }
.star-input .star.active { color: #f59e0b; }
.star-input .star:hover { transform: scale(1.15); }
.status-select { display: flex; gap: 8px; flex-wrap: wrap; }
.status-option {
  padding: 8px 16px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); cursor: pointer; font-size: 0.85rem;
  transition: var(--transition); background: var(--surface);
}
.status-option.selected { background: var(--text); color: #fff; border-color: var(--text); }
.status-option:hover:not(.selected) { background: var(--surface-hover); }
textarea {
  width: 100%; min-height: 100px; padding: 12px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: inherit; font-size: 0.9rem; resize: vertical;
  transition: var(--transition);
}
textarea:focus { outline: none; border-color: var(--text-secondary); }
input[type="date"] {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius-sm); font-family: inherit; font-size: 0.9rem;
}

/* ===== Image Upload in Modal ===== */
.image-upload-area {
  border: 2px dashed var(--border); border-radius: var(--radius-sm);
  padding: 20px; text-align: center; cursor: pointer;
  transition: var(--transition); color: var(--text-tertiary);
  font-size: 0.85rem;
}
.image-upload-area:hover { border-color: var(--text-secondary); background: var(--surface-hover); }
.image-upload-area .upload-icon { font-size: 1.6rem; margin-bottom: 6px; }
.image-preview-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px;
}
.image-preview-item {
  position: relative; aspect-ratio: 4/3; border-radius: 6px; overflow: hidden;
  cursor: pointer; background: var(--surface-hover);
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; display: block; }
.image-preview-item .remove-btn {
  position: absolute; top: 4px; right: 4px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(0,0,0,0.6); color: #fff; border: none;
  cursor: pointer; font-size: 0.7rem; display: flex;
  align-items: center; justify-content: center;
  transition: var(--transition);
}
.image-preview-item .remove-btn:hover { background: rgba(220,38,38,0.85); }

/* ===== Lightbox ===== */
.lightbox {
  position: fixed; inset: 0; background: rgba(0,0,0,0.9);
  z-index: 300; display: flex; align-items: center; justify-content: center;
  animation: fadeIn 0.2s ease; padding: 40px;
}
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; object-fit: contain; }
.lightbox .lightbox-close {
  position: absolute; top: 20px; right: 24px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.15); color: #fff; border: none;
  cursor: pointer; font-size: 1.2rem; display: flex;
  align-items: center; justify-content: center;
  transition: var(--transition);
}
.lightbox .lightbox-close:hover { background: rgba(255,255,255,0.3); }
.lightbox .lightbox-nav {
  position: absolute; top: 50%; transform: translateY(-50%);
  width: 44px; height: 44px; border-radius: 50%;
  background: rgba(255,255,255,0.12); color: #fff; border: none;
  cursor: pointer; font-size: 1.3rem; display: flex;
  align-items: center; justify-content: center;
  transition: var(--transition);
}
.lightbox .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
.lightbox .lightbox-prev { left: 24px; }
.lightbox .lightbox-next { right: 24px; }

/* ===== Episode images indicator ===== */
.episode-images-badge {
  display: inline-flex; align-items: center; gap: 3px;
  font-size: 0.75rem; color: var(--text-tertiary);
  background: var(--surface-hover); padding: 2px 8px; border-radius: 10px;
}

/* ===== Episode Detail Panel ===== */
.detail-panel {
  background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); overflow: hidden; margin-bottom: 24px;
}
.detail-banner {
  height: 200px; object-fit: cover; width: 100%; display: block;
}
.detail-banner-placeholder {
  height: 200px; display: flex; align-items: center; justify-content: center;
  font-size: 3rem; color: rgba(255,255,255,0.4);
}
.detail-content { padding: 24px 28px; }
.detail-content h2 { font-size: 1.4rem; font-weight: 700; margin-bottom: 8px; }
.detail-content .detail-meta { display: flex; gap: 16px; font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 16px; }

/* ===== Empty State ===== */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-tertiary); }
.empty-state .icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }

/* ===== Toast ===== */
.toast {
  position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: #fff; padding: 10px 24px;
  border-radius: var(--radius-sm); font-size: 0.85rem;
  z-index: 200; animation: fadeIn 0.2s ease;
  box-shadow: var(--shadow-lg);
}

/* ===== Responsive ===== */
@media (max-width: 640px) {
  #app { padding: 0 16px 60px; }
  .game-grid { grid-template-columns: 1fr; }
  .version-grid { grid-template-columns: 1fr; }
  .game-detail-header { flex-direction: column; text-align: center; }
  .game-detail-stats { justify-content: center; }
  .episode-item { flex-wrap: wrap; }
  .episode-status { width: 100%; justify-content: space-between; }
  .calendar-grid { grid-template-columns: repeat(2, 1fr); }
  .cal-day { min-height: 70px; }
  .calendar-stats { flex-wrap: wrap; }
  .cal-stat-card { min-width: 45%; }
}

/* ===== Calendar Dashboard ===== */
.calendar-stats {
  display: flex; gap: 16px; margin-bottom: 24px;
}
.cal-stat-card {
  flex: 1; background: var(--surface); border-radius: var(--radius);
  border: 1px solid var(--border); padding: 20px; text-align: center;
}
.cal-stat-card .num { font-size: 2rem; font-weight: 800; }
.cal-stat-card .label { font-size: 0.8rem; color: var(--text-tertiary); margin-top: 4px; }
.calendar-nav {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; margin-bottom: 20px;
}
.calendar-nav button {
  border: 1px solid var(--border); background: var(--surface);
  border-radius: var(--radius-sm); padding: 8px 14px;
  cursor: pointer; font-size: 0.9rem; transition: var(--transition);
  font-family: inherit;
}
.calendar-nav button:hover { background: var(--surface-hover); }
.calendar-nav .month-label { font-size: 1.1rem; font-weight: 600; min-width: 140px; text-align: center; }
.calendar-grid {
  display: grid; grid-template-columns: repeat(7, 1fr);
  gap: 1px; background: var(--border);
  border-radius: var(--radius); overflow: hidden;
  border: 1px solid var(--border);
}
.cal-weekday {
  background: var(--surface); padding: 10px 8px;
  text-align: center; font-size: 0.78rem; font-weight: 600;
  color: var(--text-secondary);
}
.cal-day {
  background: var(--surface); min-height: 110px;
  padding: 6px; display: flex; flex-direction: column;
  gap: 4px; position: relative; transition: var(--transition);
}
.cal-day:hover { background: var(--surface-hover); }
.cal-day.other-month { background: #fafafa; opacity: 0.5; }
.cal-day.today { box-shadow: inset 0 0 0 2px var(--accent); }
.cal-day .day-num { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
.cal-day.has-episodes .day-num { color: var(--text); }
.cal-day.today .day-num { color: var(--accent); }
.cal-episode-thumb {
  width: 100%; aspect-ratio: 16/9; border-radius: 4px;
  object-fit: cover; cursor: pointer; transition: var(--transition);
  border: 1px solid var(--border); display: block;
}
.cal-episode-thumb:hover { transform: scale(1.08); z-index: 2; box-shadow: var(--shadow-lg); position: relative; }
.cal-episode-thumb-placeholder {
  width: 100%; aspect-ratio: 16/9; border-radius: 4px;
  display: flex; align-items: center; justify-content: center;
  color: rgba(255,255,255,0.7); font-size: 0.65rem; cursor: pointer;
  transition: var(--transition); border: 1px solid var(--border);
}
.cal-episode-thumb-placeholder:hover { transform: scale(1.08); z-index: 2; box-shadow: var(--shadow-lg); position: relative; }
.cal-episode-more {
  font-size: 0.7rem; color: var(--text-tertiary);
  text-align: center; padding: 2px; cursor: pointer;
}
.cal-episode-more:hover { color: var(--text-secondary); }
.cal-timeline { margin-top: 8px; }
.cal-timeline-item {
  display: flex; gap: 16px; padding: 16px 20px;
  background: var(--surface); border-radius: var(--radius-sm);
  border: 1px solid var(--border); margin-bottom: 12px;
  align-items: flex-start;
}
.cal-timeline-date {
  flex-shrink: 0; width: 64px; text-align: center;
  padding-top: 2px;
}
.cal-timeline-date .month-day { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
.cal-timeline-date .weekday { font-size: 0.72rem; color: var(--text-tertiary); }
.cal-timeline-episodes { flex: 1; display: flex; flex-direction: column; gap: 10px; }
.cal-timeline-ep {
  display: flex; align-items: center; gap: 10px;
}
.cal-timeline-ep img { width: 64px; height: 36px; border-radius: 4px; object-fit: cover; flex-shrink: 0; }
.cal-timeline-ep .ep-placeholder { width: 64px; height: 36px; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); font-size: 0.65rem; flex-shrink: 0; }
.cal-timeline-ep .ep-info { font-size: 0.85rem; min-width: 0; }
.cal-timeline-ep .ep-info .ep-title { font-weight: 500; }
.cal-timeline-ep .ep-info .ep-game { font-size: 0.75rem; color: var(--text-tertiary); margin-top: 2px; }

/* ===== 剧情问答（RAG） ===== */
.qa-panel { display: flex; flex-direction: column; gap: 16px; }
.qa-index-bar {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  font-size: 0.82rem; color: var(--text-secondary);
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); padding: 10px 14px;

// ===== Persistence =====
// 数据保存分三层，互为兜底：
//   1. 本地服务（server.py）—— 自动写入 index.html 同目录的「剧情记录数据.json」
//      · 直接双击 index.html（file://）时，只要本地服务在跑，也会照常写入
//   2. 磁盘桥接文件「剧情记录数据.js」—— 服务每次保存时同步生成，
//      双击打开时无需服务即可读到全部记录
//   3. 浏览器 LocalStorage   —— 临时缓存，没有服务时也不丢改动
const IS_FILE_PROTOCOL = location.protocol === 'file:';
const SERVER_ORIGIN = 'http://localhost:8090';
let serverMode = false;      // 本地服务可用
let serverApi = null;        // 实际可用的接口地址（同源相对路径或 localhost 绝对地址）
let serverTimer = null;      // 防抖定时器
let lastServerSave = 0;      // 最近一次成功写入文件的时间

// 依次尝试的接口地址。
// 关键：无论页面是从 file:// 打开，还是从 WorkBuddy 内置预览等「非 localhost」
// 的来源打开，都一律可以直接连本地服务——否则一旦来源不是 localhost，
// 相对路径 '/api/data' 只会打到预览自己的源上，记录就写不进数据文件了。
function apiCandidates() {
  const list = [];
  const sameOrigin = !IS_FILE_PROTOCOL && /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (sameOrigin) list.push('/api/data');          // 页面本身就是 localhost:8090
  list.push(SERVER_ORIGIN + '/api/data');          // 绝对地址：任意来源都能连
  list.push('http://127.0.0.1:8090/api/data');
  return list;
}

// 探测本地服务；可用则返回其数据，并记下接口地址
async function probeServer() {
  for (const url of apiCandidates()) {
    try {
      const res = await fetch(url, { method: 'GET', cache: 'no-store' });
      if (!res.ok) continue;
      const data = await res.json().catch(() => null);
      // 严格校验：必须确实是本应用的数据结构。
      // 否则静态服务器对未知路径返回 200(HTML) 时会被误判成“服务可用”。
      if (data && data.app === 'storylog' && data.reviews && typeof data.reviews === 'object') {
        serverApi = url;
        return data;
      }
    } catch (e) { /* 试下一个地址 */ }
  }
  return null;
}

// 磁盘桥接数据（剧情记录数据.js，由 server.py 生成）
function bridgeData() {
  const d = window.STORYLOG_DATA;
  if (d && typeof d === 'object' && d.reviews && typeof d.reviews === 'object') return d;
  return null;
}

function localSavedAt() {
  return parseInt(localStorage.getItem('storylog_lastsave') || '0', 10);
}

function buildPayload() {
  return { app: 'storylog', savedAt: Date.now(), reviews: state.reviews };
}

function writeLocal(reviews, savedAt) {
  try {
    localStorage.setItem('storylog_reviews', JSON.stringify(reviews));
    localStorage.setItem('storylog_lastsave', String(savedAt || Date.now()));
  } catch (e) { console.warn('LocalStorage 写入失败', e); }
}

function loadLocalState() {
  try {
    const saved = localStorage.getItem('storylog_reviews');
    if (saved) state.reviews = JSON.parse(saved);
  } catch (e) { console.warn('LocalStorage 读取失败', e); }
}

function saveState() {
  writeLocal(state.reviews, Date.now());
  scheduleServerSave();
  scheduleBackup();
}

function scheduleServerSave() {
  // 不再用 serverMode 门控：即便开机时没探测到服务，也照样排队尝试写入，
  // 成功就会自动切入服务模式（解决“预览面板打开时服务刚启动/刚重启”的时序问题）
  clearTimeout(serverTimer);
  serverTimer = setTimeout(() => pushServerData(), 700);
}

async function pushServerData() {
  const url = serverApi || (SERVER_ORIGIN + '/api/data');
  try {
    // 用 text/plain 发送 JSON 文本：跨源（file:// / 预览来源 -> localhost）时不会触发预检
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
      body: JSON.stringify(buildPayload()),
    });
    if (res.ok) {
      const j = await res.json().catch(() => ({}));
      if (j && j.ok) {
        serverMode = true;
        serverApi = url;
        lastServerSave = Date.now();
        hidePersistHint();
        updateBackupBtn();
        return true;
      }
    }
  } catch (e) { /* 服务未启动或网络受限：静默等待下次重试 */ }
  return false;
}

// 页面关闭/切到后台时补一次写入，避免防抖期间的改动丢失
window.addEventListener('beforeunload', () => {
  try {
    const url = serverApi || (SERVER_ORIGIN + '/api/data');
    navigator.sendBeacon(url,
      new Blob([JSON.stringify(buildPayload())], { type: 'text/plain;charset=UTF-8' }));
  } catch (e) { /* ignore */ }
});
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') pushServerData();
});

// ===== Local File Auto-Backup =====
// 使用 File System Access API 将数据自动备份到本地 JSON 文件。
// 首次需用户点击选择一次文件，之后每次改动自动写入；打开页面时若
// LocalStorage 被清空而备份文件有数据，则自动恢复。
const BACKUP_FILENAME = '剧情记录数据.json';
let backupHandle = null;   // FileSystemFileHandle
let backupReady = false;   // 已授权且可写入
let backupTimer = null;

function idbOpen() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('storylog-backup', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('handles');
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function idbSet(key, val) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readwrite');
    tx.objectStore('handles').put(val, key);
    tx.oncomplete = res; tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key) {
  const db = await idbOpen();
  return new Promise((res, rej) => {
    const tx = db.transaction('handles', 'readonly');
    const rq = tx.objectStore('handles').get(key);
    rq.onsuccess = () => res(rq.result); rq.onerror = () => rej(rq.error);
  });
}

async function enableBackup() {
  if (!window.showSaveFilePicker) {
    toast('当前浏览器不支持本地自动备份，建议用 Chrome / Edge 打开');
    return;
  }
  try {
    backupHandle = await showSaveFilePicker({
      suggestedName: BACKUP_FILENAME,
      types: [{ description: 'JSON 备份', accept: { 'application/json': ['.json'] } }]
    });
    await idbSet('handle', backupHandle);
    backupReady = true;
    await writeBackup();
    updateBackupBtn();
    toast('自动备份已开启：每次改动都会保存到所选文件');
  } catch (e) { /* 用户取消选择 */ }
}

function scheduleBackup() {
  if (!backupReady) return;
  clearTimeout(backupTimer);
  backupTimer = setTimeout(writeBackup, 1500);
}

async function writeBackup() {
  if (!backupHandle) return;
  try {
    const writable = await backupHandle.createWritable();
    await writable.write(JSON.stringify(
      { app: 'storylog', savedAt: Date.now(), reviews: state.reviews }, null, 2));
    await writable.close();
  } catch (e) { console.warn('Backup write failed:', e); }
}

async function tryRestoreFromBackup() {
  try {
    const file = await backupHandle.getFile();
    if (!file.size) return;                       // 全新空文件
    const data = JSON.parse(await file.text());
    if (!data.reviews || !Object.keys(data.reviews).length) return;
    const localSaved = parseInt(localStorage.getItem('storylog_lastsave') || '0', 10);
    const localEmpty = Object.keys(state.reviews).length === 0;
    const backupNewer = (data.savedAt || 0) > localSaved;
    const differs = JSON.stringify(data.reviews) !== JSON.stringify(state.reviews);
    if (localEmpty || (backupNewer && differs)) {
      state.reviews = { ...state.reviews, ...data.reviews };
      localStorage.setItem('storylog_reviews', JSON.stringify(state.reviews));
      localStorage.setItem('storylog_lastsave', String(data.savedAt || Date.now()));
      render();
      toast(localEmpty ? '检测到浏览器数据被清空，已从本地备份自动恢复' : '已从本地备份同步较新数据');
    }
  } catch (e) { console.warn('Backup restore failed:', e); }
}

async function initBackup() {
  try {
    const handle = await idbGet('handle');
    if (!handle) { updateBackupBtn(); return; }
    backupHandle = handle;
    const perm = await handle.queryPermission({ mode: 'readwrite' });
    if (perm === 'granted') {
      backupReady = true;
      await tryRestoreFromBackup();
    } else {
      // 权限需要用户手势触发，挂在页面首次点击上
      document.addEventListener('click', async () => {
        try {
          const p = await backupHandle.requestPermission({ mode: 'readwrite' });
          if (p === 'granted') {
            backupReady = true;
            await tryRestoreFromBackup();
            updateBackupBtn();
          }
        } catch (e) { /* ignore */ }
      }, { once: true });
    }
  } catch (e) { console.warn('Backup init failed:', e); }
  updateBackupBtn();
}

function onBackupBtnClick() {
  // 无论当前状态，点击都主动尝试写入数据文件一次
  pushServerData().then(ok => {
    if (ok) { toast('已保存到本地数据文件'); return; }
    // 没连上本地服务：能走浏览器文件备份就走，否则给出明确提示
    if (!IS_FILE_PROTOCOL && window.showSaveFilePicker) {
      if (!backupHandle) { enableBackup(); return; }
      if (backupReady) { writeBackup().then(() => toast('已手动保存一次备份')); return; }
      backupHandle.requestPermission({ mode: 'readwrite' }).then(p => {
        if (p === 'granted') { backupReady = true; tryRestoreFromBackup(); updateBackupBtn(); }
      });
      return;
    }
    toast('未连上本地保存服务：请运行 start-storylog.bat 后刷新本页');
  });
}

function updateBackupBtn() {
  const btn = document.getElementById('btn-backup');
  if (!btn) return;

  // 本地服务模式：数据自动写入 index.html 同目录的 JSON 文件
  if (serverMode) {
    if (lastServerSave) {
      const t = new Date(lastServerSave).toLocaleTimeString('zh-CN', { hour12: false });
      btn.textContent = `本地保存 ✓ ${t}`;
    } else {
      btn.textContent = '本地保存: 已开启';
    }
    btn.title = '数据自动保存到 index.html 同目录的「剧情记录数据.json」，点击可立即保存一次';
    return;
  }

  // 未连上本地服务（file:// 双击打开，或 WorkBuddy 预览等非 localhost 来源）
  const sameOriginHost = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
  if (IS_FILE_PROTOCOL || !sameOriginHost) {
    btn.textContent = '本地保存: 未接入';
    btn.title = '未连上本地保存服务；运行 start-storylog.bat 后刷新本页即可自动保存。点击可重试连接';
    return;
  }

  // 兜底：浏览器文件备份（同源 localhost 但服务挂了的情况）
  if (!window.showSaveFilePicker) {
    btn.textContent = '本地保存: 未开启';
    btn.title = '请用 server.py 启动本地服务以启用自动保存';
    return;
  }
  if (backupReady) {
    btn.textContent = '自动备份: 已开启';
    btn.title = '点击立即保存一次备份';
  } else if (backupHandle) {
    btn.textContent = '自动备份: 待授权';
    btn.title = '点击授权以继续自动备份';
  } else {
    btn.textContent = '自动备份: 未开启';
    btn.title = '点击选择备份文件；推荐改用 server.py 启动本地服务自动保存';
  }
}

// --- 保存状态提示条 ---
function hidePersistHint() {
  const el = document.getElementById('persist-banner');
  if (el) el.hidden = true;
}

function showPersistHint() {
  const el = document.getElementById('persist-banner');
  if (!el) return;
  const n = Object.keys(state.reviews).length;
  el.hidden = false;

  const origin = location.protocol + '//' + (location.host || '(本地文件)');
  const mixed = location.protocol === 'https:'
    ? `<span>⚠️ 当前页面是 https，浏览器会拦截对 http://localhost 的写入；请改用 <b>start-storylog.bat</b> 打开。</span>`
    : '';

  el.innerHTML =
    `<span>⚠️ <b>当前未连上本地保存服务</b>（来源：${origin}）：已读到 ${n} 条记录，` +
    `但新增/修改目前只暂存在这个浏览器来源里，尚未写回数据文件。</span>` +
    mixed +
    `<span>运行 <b>start-storylog.bat</b> 打开本页即可自动同步，<u>无需重填数据</u>。</span>` +
    `<a class="pb-btn" href="${SERVER_ORIGIN}/index.html">打开本地服务版</a>`;
}

// 把服务器数据合并进本地（并集合并，任何一边独有的记录都不会丢）
async function adoptServer(serverData) {
  serverMode = true;
  const serverReviews = (serverData && serverData.reviews) || {};
  const serverSaved = (serverData && serverData.savedAt) || 0;
  const serverCount = Object.keys(serverReviews).length;
  const localCount = Object.keys(state.reviews).length;
  const localSaved = localSavedAt();

  // 以较新一方为基线，但用并集合并——绝不因为"谁更新"而丢掉另一边的记录
  const useServer = serverCount > 0 && (localCount === 0 || serverSaved >= localSaved);
  const merged = useServer
    ? { ...state.reviews, ...serverReviews }
    : { ...serverReviews, ...state.reviews };
  const restored = localCount === 0 && serverCount > 0;

  state.reviews = merged;
  writeLocal(merged, Math.max(serverSaved, localSaved));
  render();
  if (restored) toast(`已从本地数据文件恢复 ${serverCount} 条记录`);

  // 文件里缺失的记录（本地新增）→ 回写补齐；文件为空也要回写
  const needPush = serverCount === 0 ? localCount > 0 : Object.keys(merged).length > serverCount;
  if (needPush) await pushServerData();

  hidePersistHint();
  updateBackupBtn();
}

// 未连上服务时，持续尝试重连；一旦连上自动同步（无需用户重填数据）
let reconnectTimer = null;
function startServerReconnect() {
  if (reconnectTimer) return;
  reconnectTimer = setInterval(async () => {
    if (serverMode) { clearInterval(reconnectTimer); reconnectTimer = null; return; }
    const data = await probeServer();
    if (data) {
      await adoptServer(data);
      toast('已连接本地服务，记录已同步到数据文件');
    }
  }, 8000);
}

// 清除测试残留记录（id 以 "__" 开头）。真实章节 id 不会这样命名。
// 不清掉的话，这些脏数据会在页面之间来回同步、被反复推送。
function cleanStaleTestKeys() {
  let changed = false;
  Object.keys(state.reviews).forEach(k => {
    if (k.startsWith('__')) { delete state.reviews[k]; changed = true; }
  });
  if (changed) writeLocal(state.reviews, Date.now());
  return changed;
}

// 启动时：先用磁盘桥接文件兜底 → 再连本地服务 → 最后回退浏览器备份
async function initPersistence() {
  cleanStaleTestKeys();
  // 第 1 步：吃掉磁盘桥接数据（file:// 等场景下也能拿到完整记录）
  const bridge = bridgeData();
  if (bridge && Object.keys(bridge.reviews).length) {
    const empty = Object.keys(state.reviews).length === 0;
    const bridgeNewer = (bridge.savedAt || 0) > localSavedAt();
    if (empty) {
      state.reviews = { ...bridge.reviews };
    } else if (bridgeNewer) {
      state.reviews = { ...state.reviews, ...bridge.reviews };
    } else {
      // 本地较新：只补桥接里独有的，不覆盖本地改动
      state.reviews = { ...bridge.reviews, ...state.reviews };
    }
    writeLocal(state.reviews, Math.max(bridge.savedAt || 0, localSavedAt()));
    render();
    if (empty) toast(`已从数据文件恢复 ${Object.keys(bridge.reviews).length} 条记录`);
  }

  // 第 2 步：探测本地服务
  const serverData = await probeServer();
  if (serverData) { await adoptServer(serverData); return; }

  // 第 3 步：没连上本地服务 —— 先用浏览器缓存，同时持续重连（连上即自动同步）
  updateBackupBtn();
  showPersistHint();
  startServerReconnect();
}

// ===== Helpers =====
function getGame(id) { return GAMES.find(g => g.id === id); }
function getVersion(game, vid) { return game.versions.find(v => v.id === vid); }
function getEpisode(game, vid, eid) {
  const v = getVersion(game, vid);
  if (!v) return null;
  return v.episodes.find(e => e.id === eid);
}
function getReview(eid) { return state.reviews[eid] || { rating: 0, status: 'unset', review: '', date: '', images: [] }; }
function getAllEpisodes(game) {
  let all = [];
  game.versions.forEach(v => { v.episodes.forEach(e => all.push({ ...e, versionId: v.id, versionTitle: v.title })); });
  return all;
}
function getGameProgress(game) {
  const eps = getAllEpisodes(game);
  const completed = eps.filter(e => (state.reviews[e.id] || {}).status === 'completed').length;
  const rated = eps.filter(e => (state.reviews[e.id] || {}).rating > 0).length;
  return { total: eps.length, completed, rated };
}

// ===== Calendar Helpers =====
function getAllWatchedEpisodes() {
  const all = [];
  GAMES.forEach(game => {
    game.versions.forEach(version => {
      version.episodes.forEach(ep => {
        const r = state.reviews[ep.id];
        if (r && r.date) all.push({ episode: ep, game, version, review: r });
      });
    });
  });
  all.sort((a, b) => new Date(b.review.date) - new Date(a.review.date));
  return all;
}

function getCalendarData(year, month) {
  const data = {};
  GAMES.forEach(game => {
    game.versions.forEach(version => {
      version.episodes.forEach(ep => {
        const r = state.reviews[ep.id];
        if (r && r.date) {
          const d = new Date(r.date);
          if (d.getFullYear() === year && d.getMonth() === month) {
            const day = d.getDate();
            if (!data[day]) data[day] = [];
            data[day].push({ episode: ep, game, version, review: r });
          }
        }
      });
    });
  });
  return data;
}

function calculateStreak() {
  const watched = getAllWatchedEpisodes();
  if (watched.length === 0) return 0;
  const dateSet = new Set(watched.map(w => w.review.date));
  let streak = 0;
  const checkDate = new Date();
  // If today has no activity, start from yesterday
  const todayStr = checkDate.toISOString().slice(0, 10);
  if (!dateSet.has(todayStr)) {
    checkDate.setDate(checkDate.getDate() - 1);
  }
  while (true) {
    const ds = checkDate.toISOString().slice(0, 10);
    if (dateSet.has(ds)) {
      streak++;
      checkDate.setDate(checkDate.getDate() - 1);
    } else break;
  }
  return streak;
}
function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2000);
}

// Compress image to fit within maxDim, return base64 JPEG
function compressImage(file, maxDim, callback) {
  const reader = new FileReader();
  reader.onload = function(ev) {
    const img = new Image();
    img.onload = function() {
      let w = img.width, h = img.height;
      if (w > maxDim || h > maxDim) {
        if (w > h) { h = Math.round(h * maxDim / w); w = maxDim; }
        else { w = Math.round(w * maxDim / h); h = maxDim; }
      }
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, w, h);
      callback(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

// Lightbox viewer
function openLightbox(images, index) {
  let curIdx = index;
  const lb = document.createElement('div');
  lb.className = 'lightbox';
  lb.innerHTML = `
    <button class="lightbox-close">\u2715</button>
    ${images.length > 1 ? `<button class="lightbox-nav lightbox-prev">\u2039</button><button class="lightbox-nav lightbox-next">\u203a</button>` : ''}
    <img src="${images[curIdx]}" alt="">
  `;
  const imgEl = lb.querySelector('img');
  lb.addEventListener('click', (e) => {
    if (e.target === lb || e.target.classList.contains('lightbox-close')) lb.remove();
  });
  lb.querySelector('.lightbox-close').addEventListener('click', () => lb.remove());
  const prev = lb.querySelector('.lightbox-prev');
  const next = lb.querySelector('.lightbox-next');
  function update() { imgEl.src = images[curIdx]; }
  if (prev) prev.addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx - 1 + images.length) % images.length; update(); });
  if (next) next.addEventListener('click', (e) => { e.stopPropagation(); curIdx = (curIdx + 1) % images.length; update(); });
  document.body.appendChild(lb);
}

// ===== Rendering =====
function render() {
  const app = document.getElementById('app');
  if (state.view === 'library') {
    app.innerHTML = renderLibrary();
    attachLibraryEvents();
  } else if (state.view === 'detail') {
    const game = getGame(state.gameId);
    app.innerHTML = renderDetail(game);
    attachDetailEvents(game);
  } else if (state.view === 'episodes') {
    const game = getGame(state.gameId);
    const version = getVersion(game, state.versionId);
    app.innerHTML = renderEpisodes(game, version);
    attachEpisodesEvents(game, version);
  } else if (state.view === 'calendar') {
    app.innerHTML = renderCalendar();
    attachCalendarEvents();
  } else if (state.view === 'qa') {
    app.innerHTML = renderQA();
    attachQAEvents();
  }
  window.scrollTo(0, 0);
}

// --- Episodes View ---
function renderEpisodes(game, version) {
  const filter = state.episodeFilter || 'all';
  const sortOrder = state.episodeSortOrder || 'asc';
  let episodes = version.episodes.filter(e => {
    if (filter === 'all') return true;
    const r = getReview(e.id);
    return r.status === filter;
  });
  if (sortOrder === 'desc') episodes = episodes.slice().reverse();

  const episodeItems = episodes.map(e => {
    const r = getReview(e.id);
    const statusOpt = STATUS_OPTIONS.find(s => s.value === r.status) || STATUS_OPTIONS[0];
    const stars = r.rating > 0 ? '<span class="star-display">' + '\u2605'.repeat(r.rating) + '\u2606'.repeat(5 - r.rating) + '</span>' : '';
    const posterHtml = e.poster
      ? `<img class="episode-poster" src="${e.poster}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="episode-poster-placeholder" style="display:none;background:${game.gradient}">${game.logoText}</div>`
      : `<div class="episode-poster-placeholder" style="background:${game.gradient}">${game.logoText}</div>`;
    return `
      <div class="episode-item" data-episode="${e.id}">
        ${posterHtml}
        <div class="episode-info">
          <h4>${escapeHtml(e.title)}</h4>
          <div class="meta">${r.date ? '记录于 ' + r.date : (r.review ? '有评价' : '点击记录体验')}${r.images && r.images.length > 0 ? ' · ' + r.images.length + ' 张截图' : ''}</div>
        </div>
        <div class="episode-status">
          ${stars}
          ${r.images && r.images.length > 0 ? '<span class="episode-images-badge">\u{1F4F7} ' + r.images.length + '</span>' : ''}
          <span class="status-badge ${statusOpt.class}">${statusOpt.label}</span>
        </div>
      </div>`;
  }).join('');

  const bannerHtml = version.poster
    ? `<img class="detail-banner" src="${version.poster}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="detail-banner-placeholder" style="display:none;background:${game.gradient}">${game.logoText}</div>`
    : `<div class="detail-banner-placeholder" style="background:${game.gradient}">${game.logoText}</div>`;

  const sortBtn = `<div class="filter-chip" id="sort-toggle" title="切换排序">${sortOrder === 'asc' ? '\u2193 正序' : '\u2191 倒序'}</div>`;

  const filterChips = `
    <div class="filter-chips">
      ${STATUS_OPTIONS.map(s => {
        const count = version.episodes.filter(e => getReview(e.id).status === s.value).length;
        if (s.value === 'unset' && count === 0) return '';
        return `<div class="filter-chip ${filter === s.value ? 'active' : ''}" data-filter="${s.value}">${s.label}${count > 0 ? ' (' + count + ')' : ''}</div>`;
      }).join('')}
      <div class="filter-chip ${filter === 'all' ? 'active' : ''}" data-filter="all">全部</div>
      ${sortBtn}
    </div>`;

  return `
    <div class="view">
      <div class="header">
        <h1><span class="logo-mark" style="background:${game.color}">${game.logoText}</span>剧情志</h1>

          <button class="btn btn-ghost" id="btn-back">返回</button>

      <div class="breadcrumb">
        <a data-action="library">游戏库</a>
        <span class="sep">/</span>
        <a data-action="detail">${game.name}</a>
        <span class="sep">/</span>

          <h2>${escapeHtml(version.title)}</h2>

            <span>${version.episodes.length} 个剧情</span>
          </div>
        </div>

    </div>`;

          <label>剧情截图</label>
          <div class="image-upload-area" id="img-upload-area">
            <div class="upload-icon">\u{1F4F7}</div>
            <div>点击或拖拽添加截图</div>
          </div>
          <input type="file" id="img-input" accept="image/*" multiple style="display:none">
          <div class="image-preview-grid" id="img-preview-grid"></div>
        </div>
      </div>
      <div class="modal-footer">
        ${r.status !== 'unset' || r.rating > 0 || r.review || (r.images && r.images.length > 0) ? `<button class="btn btn-ghost" id="btn-clear" style="margin-right:auto;color:#dc2626">清除记录</button>` : ''}
        <button class="btn btn-ghost" id="btn-cancel">取消</button>
        <button class="btn btn-primary" id="btn-save">保存</button>
      </div>
    </div>`;

  overlay.addEventListener('click', () => overlay.remove());
  document.body.appendChild(overlay);

  // Star interactions
  let tempRating = r.rating;
  const stars = overlay.querySelectorAll('.star-input .star');
  stars.forEach(star => {
    star.addEventListener('click', () => {
      tempRating = parseInt(star.dataset.val);
      stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= tempRating));
    });
    star.addEventListener('mouseenter', () => {
      const val = parseInt(star.dataset.val);
      stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= val));
    });
  });
  overlay.querySelector('.star-input').addEventListener('mouseleave', () => {
    stars.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= tempRating));
  });

  // Status interactions
  let tempStatus = r.status;
  overlay.querySelectorAll('.status-option').forEach(opt => {
    opt.addEventListener('click', () => {
      tempStatus = opt.dataset.val;
      overlay.querySelectorAll('.status-option').forEach(o => o.classList.toggle('selected', o === opt));
    });
  });

  // Image upload interactions
  let tempImages = (r.images || []).slice();
  const imgInput = overlay.querySelector('#img-input');
  const imgUploadArea = overlay.querySelector('#img-upload-area');
  const imgPreviewGrid = overlay.querySelector('#img-preview-grid');

  function renderImagePreviews() {
    imgPreviewGrid.innerHTML = tempImages.map((src, i) => `
      <div class="image-preview-item" data-idx="${i}">
        <img src="${src}" alt="截图 ${i+1}">
        <button class="remove-btn" data-idx="${i}">\u2715</button>
      </div>
    `).join('');
    // Click image to open lightbox
    imgPreviewGrid.querySelectorAll('.image-preview-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (e.target.classList.contains('remove-btn')) return;
        openLightbox(tempImages, parseInt(item.dataset.idx));
      });
    });
    // Remove buttons
    imgPreviewGrid.querySelectorAll('.remove-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const idx = parseInt(btn.dataset.idx);
        tempImages.splice(idx, 1);
        renderImagePreviews();
      });
    });
  }

  function handleFiles(files) {
    const fileArr = Array.from(files).filter(f => f.type.startsWith('image/'));
    let processed = 0;
    if (fileArr.length === 0) return;
    fileArr.forEach(f => {
      compressImage(f, 1280, (dataUrl) => {
        tempImages.push(dataUrl);
        processed++;
        if (processed === fileArr.length) renderImagePreviews();
      });
    });
  }

  imgUploadArea.addEventListener('click', () => imgInput.click());
  imgInput.addEventListener('change', (e) => { handleFiles(e.target.files); e.target.value = ''; });

  // Drag and drop
  imgUploadArea.addEventListener('dragover', (e) => { e.preventDefault(); imgUploadArea.style.borderColor = 'var(--text-secondary)'; });
  imgUploadArea.addEventListener('dragleave', () => { imgUploadArea.style.borderColor = ''; });
  imgUploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    imgUploadArea.style.borderColor = '';
    handleFiles(e.dataTransfer.files);
  });

  renderImagePreviews();

  // Buttons
  overlay.querySelector('#btn-cancel').addEventListener('click', () => overlay.remove());
  overlay.querySelector('#btn-save').addEventListener('click', () => {
    const reviewText = overlay.querySelector('#review-text').value.trim();
    const date = overlay.querySelector('#review-date').value;
    if (tempRating > 0 || tempStatus !== 'unset' || reviewText || tempImages.length > 0) {
      state.reviews[episodeId] = { rating: tempRating, status: tempStatus, review: reviewText, date: date, images: tempImages };
    } else {
      delete state.reviews[episodeId];
    }
    saveState();
    overlay.remove();
    toast('已保存');
    render();
  });
  const clearBtn = overlay.querySelector('#btn-clear');
  if (clearBtn) {
    clearBtn.addEventListener('click', () => {
      delete state.reviews[episodeId];
      saveState();
      overlay.remove();
      toast('已清除记录');
      render();
    });
  }
}

// --- QA View（剧情问答 / RAG，路径 C） ---
// 后端：server.py 的 /api/ask（BM25 检索 + LLM 生成 + 引用核验）、/api/reindex、/api/index/status
const QA_SAMPLES = [
  '原神第七章有哪些幕？',
  '钟离是谁？',
  '战双的浮点纪实收录了哪些章节？',
  '我评分最高的剧情是哪一部？',
  '剧情库里一共有多少内容？',
];
const QA_MODES = {
  llm: { label: 'LLM 生成', cls: '' },
  search_only: { label: '仅检索（未配置 LLM）', cls: 'gray' },
  degraded: { label: '降级：检索摘要', cls: 'warn' },
};
// Agent 模式（/api/agent）：ReAct 循环 + 工具调用，与 RAG 模式并存可切换
const QA_AGENT_MODES = {
  agent: { label: 'Agent 多步推理', cls: '' },
  agent_forced: { label: 'Agent（达步数上限后收敛）', cls: 'warn' },
  rag_fallback: { label: '降级：单次 RAG', cls: 'warn' },
};

let qaState = {
  asking: false, result: null, error: '', lastQuestion: '',
  index: null, game: '', pollTimer: null,
  mode: 'rag',        // rag | agent（用户选择）
  resultMode: '',     // rag | agent（产出当前结果的接口，决定用哪套卡片渲染）
  sessionId: '',      // Agent 会话 id：同一 id 复用上下文（多轮记忆）
  agent: null,        // Agent 能力信息（工具清单 / 预算 / 会话数）
};

// 与数据接口共用同一台本地服务，只替换路径
function qaApi(path) {
  let base = '';
  if (serverApi) base = serverApi.replace(/\/api\/data$/, '');
  else if (IS_FILE_PROTOCOL) base = SERVER_ORIGIN;
  return base + path;
}

async function fetchIndexStatus() {
  try {
    const res = await fetch(qaApi('/api/index/status'), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    qaState.index = await res.json();
  } catch (e) {
    qaState.index = { ragAvailable: false, ragError: e.message, stats: null, job: null };
  }
  return qaState.index;
}

async function fetchAgentInfo() {
  try {
    const res = await fetch(qaApi('/api/agent'), { cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    qaState.agent = await res.json();
  } catch (e) {
    qaState.agent = { agentAvailable: false, agentError: e.message, tools: [] };
  }
  return qaState.agent;
}

function qaJobRunning() {
  const j = qaState.index && qaState.index.job;
  return !!(j && j.running);
}

function enterQA() {
  state.view = 'qa';
  render();
  Promise.all([fetchIndexStatus(), fetchAgentInfo()]).then(() => {
    render();
    if (qaJobRunning()) startQaPolling();
  });
}

function startQaPolling() {
  stopQaPolling();
  qaState.pollTimer = setInterval(async () => {
    await fetchIndexStatus();
    render();
    if (!qaJobRunning()) {
      stopQaPolling();
      const j = (qaState.index && qaState.index.job) || {};
      toast(j.ok ? '索引重建完成' : ('索引重建结束' + (j.error ? '：' + j.error : '')));
    }
  }, 1500);
}

function stopQaPolling() {
  if (qaState.pollTimer) { clearInterval(qaState.pollTimer); qaState.pollTimer = null; }
}

async function askQuestion(q) {
  q = (q || '').trim();
  if (!q || qaState.asking) return;
  qaState.lastQuestion = q;
  qaState.asking = true;
  qaState.error = '';
  qaState.result = null;
  render();
  const useAgent = qaState.mode === 'agent';
  qaState.resultMode = useAgent ? 'agent' : 'rag';
  const path = useAgent ? '/api/agent' : '/api/ask';
  const body = useAgent
    ? { question: q, game: qaState.game || null, sessionId: qaState.sessionId || '' }
    : { question: q, game: qaState.game || null, topk: 6 };
  try {
    const res = await fetch(qaApi(path), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    if (useAgent && data.sessionId) qaState.sessionId = data.sessionId;
    qaState.result = data;
  } catch (e) {
    qaState.error = '提问失败：' + e.message;
  } finally {
    qaState.asking = false;
    render();
  }
}

async function triggerReindex() {
  if (qaJobRunning()) return;
  try {
    const res = await fetch(qaApi('/api/reindex'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ maxPages: 60 }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || data.ok === false) throw new Error(data.error || ('HTTP ' + res.status));
    toast('已开始重建索引，请稍候…');
    await fetchIndexStatus();
    render();
    startQaPolling();
  } catch (e) {
    toast('重建失败：' + e.message);
  }
}

function qaIndexBar() {
  const info = qaState.index || {};
  const stats = info.stats;
  const running = qaJobRunning();
  let dot = 'qa-dot', text = '', tags = '';
  if (!info.ragAvailable) {
    dot += ' off';
    text = '问答服务不可用' + (info.ragError ? '：' + info.ragError : '（请先启动 start-storylog.bat）');
  } else if (running) {
    dot += ' busy';
    const log = (info.job && info.job.log) || [];
    text = '正在重建索引 · ' + (log.length ? log[log.length - 1] : '正在抓取剧情正文…');
  } else if (stats) {
    text = `索引就绪：${stats.chunks} 个片段（正文 ${stats.pages} / 目录 ${stats.catalog}） · ${stats.builtAt || ''}`;
    tags = Object.entries(stats.games || {})
      .map(([g, n]) => `<span class="qa-game-tag">${escapeHtml(g)} ${n}</span>`).join('');
  } else {
    dot += ' off';
    text = '尚未建立索引，点击右侧「重建索引」开始（首次需抓取 wiki 正文）';
  }
  const btn = info.ragAvailable
    ? `<button class="btn btn-ghost qa-rebuild" id="qa-rebuild" ${running ? 'disabled' : ''}>${running ? '重建中…' : '重建索引'}</button>`
    : '';
  return `<div class="qa-index-bar"><span class="${dot}"></span><span>${text}</span>${tags}${btn}</div>`;
}

// Agent 模式：把 ReAct 执行轨迹渲染成时间线（每步工具 / 参数 / 耗时）
function qaAgentSteps(r) {
  const steps = r.steps || [];
  if (!steps.length) return '';
  const rows = steps.map(s => {
    const args = Object.entries(s.args || {}).map(([k, v]) => `${k}=${v}`).join(', ');
    return `<div class="qa-step ${s.ok ? '' : 'bad'}">
      <span class="idx">${s.step}</span>
      <span class="tool">${escapeHtml(s.tool)}</span>
      <span class="args">${escapeHtml(args || '—')}</span>
      <span class="ms">${s.ms}ms</span>
    </div>`;
  }).join('');
  const guards = (r.guardrails || []).length
    ? `<div class="qa-guard">Guardrails：${escapeHtml(r.guardrails.join(' · '))}</div>` : '';
  const sess = r.session
    ? ` · 会话 ${escapeHtml(r.session.id)} 第 ${r.session.turns} 轮` : '';
  return `<div class="qa-steps">
    <div class="qa-steps-title">执行轨迹（ReAct：${steps.length} 步${sess}）</div>
    ${rows}${guards}
  </div>`;
}

function qaResultBlock() {
  if (qaState.asking) {
    const hint = qaState.mode === 'agent'
      ? 'Agent 正在多步检索并调用工具…（它自己决定查什么、查几次，请稍候）'
      : '正在检索剧情库并生成回答…（推理模型可能需要十几秒）';
    return `<div class="qa-card"><div class="qa-loading">${hint}</div></div>`;
  }
  if (qaState.error) {
    return `<div class="qa-card"><div class="qa-answer-body" style="color:#c2410c">${escapeHtml(qaState.error)}</div></div>`;
  }
  const r = qaState.result;
  if (!r) return '';
  if (r.status === 'empty_index') {
    return '<div class="qa-card"><div class="qa-answer-body">索引为空，请先点击「重建索引」。</div></div>';
  }

  // ---- Agent 模式结果 ----
  // 用「产出结果的接口」判断而不是猜字段：Agent 降级（rag_fallback）时
  // 返回的是 sources 而非 citations/hits，按 RAG 那套渲染会渲染出空卡片
  const isAgent = qaState.resultMode === 'agent';
  if (isAgent) {
    const amode = QA_AGENT_MODES[r.mode] || { label: r.mode || '未知', cls: 'gray' };
    const u = r.usage || {};
    if (!r.answer) {
      // 无答案时也要保留头部：用户需要看到「走的是哪条链路、调了几次工具」，
      // 以及到底是「没检索到」还是「被 Guardrails 拦下」，而不是一个空白卡片
      const why = r.status === 'no_hits' ? '没有在剧情库中检索到相关内容，换个说法或重建索引后再试。' : '';
      return `<div class="qa-card">
        <div class="qa-card-head">
          <span class="qa-badge ${amode.cls}">${amode.label}</span>
          <span>工具调用 ${(r.toolsUsed || []).length} 次</span>
          <span>${u.total_tokens || 0} tokens</span>
        </div>
        <div class="qa-answer-body">${escapeHtml(r.note || why || '未获得回答')}</div>
        ${qaAgentSteps(r)}
      </div>`;
    }
    const srcs = (r.sources || []).map((s, i) => `<div class="qa-cite">
      <div class="n">[${i + 1}]</div>
      <div>
        <div>《${escapeHtml(s.gameName || '')}》${escapeHtml(s.chapter || '')}</div>
        <div class="meta">${escapeHtml((s.excerpt || '').slice(0, 90))}${s.excerpt ? '…' : ''}</div>
      </div>
    </div>`).join('');
    return `<div class="qa-card">
      <div class="qa-card-head">
        <span class="qa-badge ${amode.cls}">${amode.label}</span>
        <span>工具调用 ${(r.toolsUsed || []).length} 次</span>
        <span>耗时 ${r.elapsed != null ? r.elapsed : '—'} s</span>
        <span>${u.total_tokens || 0} tokens</span>
      </div>
      <div class="qa-answer-body">${escapeHtml(r.answer)}</div>
      ${qaAgentSteps(r)}
      ${srcs ? `<div class="qa-cites">${srcs}</div>` : ''}
      ${r.note ? `<div class="qa-note">${escapeHtml(r.note)}</div>` : ''}
    </div>`;
  }

  // ---- RAG 模式结果 ----
  if (r.status === 'no_hits') {
    return '<div class="qa-card"><div class="qa-answer-body">没有在剧情库中检索到相关内容，换个说法或重建索引后再试。</div></div>';
  }

  const mode = QA_MODES[r.mode] || { label: r.mode || '未知', cls: 'gray' };
  const hitsByN = {};
  (r.hits || []).forEach(h => { hitsByN[h.n] = h; });
  const cites = (r.citations || []).map(c => {
    const h = hitsByN[c.n] || {};
    return `<div class="qa-cite">
      <div class="n">[${c.n}]</div>
      <div>
        <div>《${escapeHtml(c.gameName)}》${escapeHtml(c.chapter || '')}</div>
        <div class="meta">${escapeHtml((h.excerpt || '').slice(0, 90))}${h.excerpt ? '…' : ''}</div>
      </div>
    </div>`;
  }).join('');

  return `<div class="qa-card">
    <div class="qa-card-head">
      <span class="qa-badge ${mode.cls}">${mode.label}</span>
      <span>置信度：${escapeHtml(r.confidence || '—')}</span>
      <span>命中 ${(r.hits || []).length} 个片段</span>
    </div>
    <div class="qa-answer-body">${escapeHtml(r.answer)}</div>
    ${cites ? `<div class="qa-cites">${cites}</div>` : ''}
    ${r.note ? `<div class="qa-note">${escapeHtml(r.note)}</div>` : ''}
  </div>`;
}

function qaModeBar() {
  const info = qaState.agent || {};
  const ready = !!info.agentAvailable;
  const hint = qaState.mode === 'agent'
    ? (ready
        ? `ReAct 多步推理 · ${(info.tools || []).length} 个工具 · 会话记忆已开启（同一会话追问会带上文）`
        : 'Agent 不可用：' + (info.agentError || '请先启动本地服务'))
    : '单次检索 + 生成，速度快；事实性问题推荐 RAG 模式';
  return `<div class="qa-modes">
    <span class="qa-mode ${qaState.mode === 'rag' ? 'active' : ''}" data-mode="rag">RAG 问答</span>
    <span class="qa-mode ${qaState.mode === 'agent' ? 'active' : ''}" data-mode="agent">Agent 问答</span>
    <span class="qa-mode-hint">${escapeHtml(hint)}</span>
  </div>`;
}

function renderQA() {
  const gameChips = [['', '全部'], ['genshin', '原神'], ['wuwa', '鸣潮'], ['pns', '战双帕弥什']]
    .map(([v, label]) => `<span class="qa-chip ${qaState.game === v ? 'active' : ''}" data-game="${v}">${label}</span>`)
    .join('');
  const samples = QA_SAMPLES.map(s => `<span class="qa-sample" data-q="${escapeHtml(s)}">${escapeHtml(s)}</span>`).join('');
  return `
    <div class="view">
      <div class="header">
        <h1><span class="logo-mark">志</span>剧情问答</h1>
        <div class="header-actions">
          <button class="btn btn-ghost" id="qa-back">返回游戏库</button>
        </div>
      </div>
      <div class="qa-panel">
        ${qaIndexBar()}
        ${qaModeBar()}
        <div class="qa-filters">${gameChips}</div>
        <div class="qa-ask-box">
          <input type="text" id="qa-input" placeholder="问点什么，例如：原神第七章有哪些幕？" value="${escapeHtml(qaState.lastQuestion)}">
          <button class="btn btn-primary" id="qa-send" ${qaState.asking ? 'disabled' : ''}>提问</button>
        </div>
        <div class="qa-samples">试试：${samples}</div>
        ${qaResultBlock()}
        ${qaState.result || qaState.asking ? '' : '<div class="qa-empty">回答基于本地索引的剧情正文（wiki）与目录，每条结论都会标注引用来源。<br>Agent 模式会自己决定调用哪些工具、查几轮。</div>'}
      </div>
    </div>`;
}

function attachQAEvents() {
  document.getElementById('qa-back').addEventListener('click', () => { state.view = 'library'; render(); });
  const input = document.getElementById('qa-input');
  const send = document.getElementById('qa-send');
  if (input) {
    // 同步到 state：render 会重建输入框，不同步的话用户刚输入的文本会丢
    input.addEventListener('input', () => { qaState.lastQuestion = input.value; });
    input.addEventListener('keydown', e => { if (e.key === 'Enter') askQuestion(input.value); });
  }
  if (send) send.addEventListener('click', () => askQuestion(input ? input.value : ''));
  const rb = document.getElementById('qa-rebuild');
  if (rb) rb.addEventListener('click', triggerReindex);
  document.querySelectorAll('.qa-mode').forEach(el => el.addEventListener('click', () => {
    const m = el.dataset.mode;
    if (m === qaState.mode) return;
    if (m === 'agent' && !(qaState.agent && qaState.agent.agentAvailable)) {
      toast('Agent 暂不可用：' + ((qaState.agent && qaState.agent.agentError) || '请先启动本地服务'));
      return;
    }
    qaState.mode = m;
    qaState.result = null;      // 切换模式清空上一轮结果，避免两种模式的卡片混在一起
    qaState.error = '';
    render();
  }));
  document.querySelectorAll('.qa-chip').forEach(el => el.addEventListener('click', () => {
    qaState.game = el.dataset.game;
    render();
  }));
  document.querySelectorAll('.qa-sample').forEach(el => el.addEventListener('click', () => {
    qaState.lastQuestion = el.dataset.q;
    askQuestion(el.dataset.q);
  }));
}

// --- Calendar View ---
function renderCalendar() {
  const year = state.calendarYear;
  const month = state.calendarMonth;
  const monthNames = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const weekdayNames = ['日','一','二','三','四','五','六'];
  const weekdayFull = ['周日','周一','周二','周三','周四','周五','周六'];

  const calData = getCalendarData(year, month);
  const allWatched = getAllWatchedEpisodes();
  const monthWatched = Object.values(calData).flat();
  const streak = calculateStreak();

  // Build calendar grid
  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const daysInPrevMonth = new Date(year, month, 0).getDate();
  const today = new Date();
  const todayStr = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;

  let gridHtml = '';
  weekdayNames.forEach(w => { gridHtml += `<div class="cal-weekday">${w}</div>`; });

  for (let i = firstDay - 1; i >= 0; i--) {
    gridHtml += `<div class="cal-day other-month"><div class="day-num">${daysInPrevMonth - i}</div></div>`;
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday = dateStr === todayStr;
    const dayEps = calData[d] || [];
    const maxThumbs = 3;

    let thumbsHtml = '';
    dayEps.slice(0, maxThumbs).forEach(item => {
      const poster = item.episode.poster || item.version.poster;
      const common = `class="cal-episode-thumb" data-episode-id="${item.episode.id}" data-game-id="${item.game.id}" data-version-id="${item.version.id}"`;
      if (poster) {
        thumbsHtml += `<img ${common} src="${poster}" alt="${escapeHtml(item.episode.title)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="cal-episode-thumb-placeholder" style="display:none;background:${item.game.gradient}">${item.game.logoText}</div>`;
      } else {
        thumbsHtml += `<div ${common} style="background:${item.game.gradient};display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,0.7);font-size:0.65rem">${item.game.logoText}</div>`;
      }
    });
    if (dayEps.length > maxThumbs) {
      thumbsHtml += `<div class="cal-episode-more" data-date="${dateStr}">+${dayEps.length - maxThumbs} 更多</div>`;
    }

    gridHtml += `<div class="cal-day${isToday ? ' today' : ''}${dayEps.length > 0 ? ' has-episodes' : ''}" data-date="${dateStr}">
      <div class="day-num">${d}</div>
      ${thumbsHtml}
    </div>`;
  }

  const totalCells = firstDay + daysInMonth;
  const remaining = (7 - (totalCells % 7)) % 7;
  for (let d = 1; d <= remaining; d++) {
    gridHtml += `<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;
  }

  // Build timeline grouped by date
  const timelineGroups = {};
  monthWatched.forEach(item => {
    const day = new Date(item.review.date).getDate();
    if (!timelineGroups[day]) timelineGroups[day] = [];
    timelineGroups[day].push(item);
  });

  const timelineHtml = Object.entries(timelineGroups)
    .sort((a, b) => parseInt(b[0]) - parseInt(a[0]))
    .map(([day, episodes]) => {
      const date = new Date(year, month, parseInt(day));
      const epsHtml = episodes.map(item => {
        const poster = item.episode.poster || item.version.poster;
        const ph = poster
          ? `<img src="${poster}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="ep-placeholder" style="display:none;background:${item.game.gradient}">${item.game.logoText}</div>`
          : `<div class="ep-placeholder" style="background:${item.game.gradient}">${item.game.logoText}</div>`;
        const r = item.review;
        const stars = r.rating > 0 ? '<span style="color:#f59e0b;font-size:0.75rem">' + '\u2605'.repeat(r.rating) + '</span>' : '';
        return `<div class="cal-timeline-ep" style="cursor:pointer" data-episode-id="${item.episode.id}" data-game-id="${item.game.id}" data-version-id="${item.version.id}">
          ${ph}
          <div class="ep-info">
            <div class="ep-title">${escapeHtml(item.episode.title)} ${stars}</div>
            <div class="ep-game">${item.game.name} \u00b7 ${escapeHtml(item.version.title)}</div>
          </div>
        </div>`;
      }).join('');
      return `<div class="cal-timeline-item">
        <div class="cal-timeline-date">
          <div class="month-day">${month+1}/${day}</div>
          <div class="weekday">${weekdayFull[date.getDay()]}</div>
        </div>
        <div class="cal-timeline-episodes">${epsHtml}</div>
      </div>`;
    }).join('');

  return `
    <div class="view">
      <div class="header">
        <h1><span class="logo-mark">志</span>剧情志</h1>
        <div class="header-actions">
          <button class="btn btn-ghost" id="btn-back-lib">返回游戏库</button>
        </div>
      </div>
      <div class="breadcrumb">
        <a data-action="library">游戏库</a>
        <span class="sep">/</span>
        <span style="color:var(--text)">观剧日历</span>
      </div>
      <div class="library-intro">
        <h2>观剧日历</h2>
        <p>追踪你的剧情体验节奏</p>
      </div>
      <div class="calendar-stats">
        <div class="cal-stat-card"><div class="num">${allWatched.length}</div><div class="label">累计观看剧情</div></div>
        <div class="cal-stat-card"><div class="num">${monthWatched.length}</div><div class="label">本月观看</div></div>
        <div class="cal-stat-card"><div class="num">${streak}</div><div class="label">连续打卡（天）</div></div>
      </div>
      <div class="calendar-nav">
        <button id="cal-prev">\u2039 上月</button>
        <span class="month-label">${year}\u5e74${monthNames[month]}</span>
        <button id="cal-next">下月 \u203a</button>
      </div>
      <div class="calendar-grid">${gridHtml}</div>
      ${monthWatched.length > 0 ? `
        <div class="section-title" style="margin-top:32px">\u672c\u6708\u65f6\u95f4\u7ebf</div>
        <div class="cal-timeline">${timelineHtml}</div>
      ` : `<div class="empty-state" style="margin-top:32px"><div class="icon">📅</div>本月暂无观剧记录</div>`}
    </div>`;
}

function attachCalendarEvents() {
  document.getElementById('btn-back-lib').addEventListener('click', () => { state.view = 'library'; render(); });
  document.querySelector('.breadcrumb a').addEventListener('click', () => { state.view = 'library'; render(); });
  document.getElementById('cal-prev').addEventListener('click', () => {
    state.calendarMonth--;
    if (state.calendarMonth < 0) { state.calendarMonth = 11; state.calendarYear--; }
    render();
  });
  document.getElementById('cal-next').addEventListener('click', () => {
    state.calendarMonth++;
    if (state.calendarMonth > 11) { state.calendarMonth = 0; state.calendarYear++; }
    render();
  });
  // Click episode thumbnails or timeline items to open review modal
  document.querySelectorAll('[data-episode-id][data-game-id][data-version-id]').forEach(el => {
    el.addEventListener('click', (e) => {
      e.stopPropagation();
      const gameId = el.dataset.gameId;
      const versionId = el.dataset.versionId;
      const episodeId = el.dataset.episodeId;
      const game = getGame(gameId);
      const version = getVersion(game, versionId);
      if (game && version) openReviewModal(game, version, episodeId);
    });
  });
}

// --- Export / Import ---
function exportData() {
  const data = { exportDate: new Date().toISOString(), reviews: state.reviews };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `\u5267\u60c5\u5fd7_\u5bfc\u51fa_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast('已导出数据');
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (ev) => {
    try {
      const data = JSON.parse(ev.target.result);
      if (data.reviews) {
        state.reviews = { ...state.reviews, ...data.reviews };
        saveState();
        toast('导入成功');
        render();
      } else {
        toast('文件格式不正确');
      }
    } catch (err) { toast('导入失败：' + err.message); }
  };
  reader.readAsText(file);
  e.target.value = '';
}

// ===== Init =====
loadLocalState();      // 先用浏览器缓存立即渲染
render();
initPersistence();     // 再异步连接本地数据文件（必要时合并较新数据）
</script>
</body>
